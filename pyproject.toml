[project]
name = "morpheus-python-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Mayo", email = "acmayo399@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
]

[project.scripts]
morpheus-python-api = "morpheus_python_api:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
